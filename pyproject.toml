# pyproject.toml - Modern Python packaging for Nissan Leaf Charging Calculator

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nissan-leaf-calculator"
version = "2.0.0"
description = "Nissan Leaf Charging Time Calculator with GUI and Console interfaces"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Merrill Holt"},
]
keywords = ["nissan", "leaf", "electric", "vehicle", "charging", "calculator", "ev"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Utilities",
    "Environment :: Console",
    "Environment :: X11 Applications :: Tk",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = []  # tkinter is part of standard library
dev = [
    "pytest>=6.0",
    "mypy>=1.0",
    "pylint>=2.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "pre-commit>=3.0.0",
]
test = [
    "pytest>=6.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.scripts]
nissan-leaf-calculator = "leaf_calculator.cli:main"

[project.urls]
Homepage = "https://github.com/merrillholt/nissan-leaf-calculator"
Repository = "https://github.com/merrillholt/nissan-leaf-calculator.git"
Issues = "https://github.com/merrillholt/nissan-leaf-calculator/issues"

# Setuptools configuration
[tool.setuptools.packages.find]
where = ["."]
include = ["leaf_calculator*"]
exclude = ["tests*", "legacy*", "*.venv*", "*__pycache__*"]

# The web interface's assets live inside the package so they ship in the
# wheel; without this the installed --web mode 500s on TemplateNotFound.
[tool.setuptools.package-data]
leaf_calculator = ["templates/*.html", "static/*.css", "static/*.js"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313', 'py314']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | venv
    | \.pytest_cache
    | _build
    | buck-out
    | build
    | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# MyPy configuration
[tool.mypy]
python_version = "3.10"
# legacy/ holds the pre-refactor implementations, kept for reference only.
exclude = ["legacy/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["tkinter.*"]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
# Cache outside the project: this tree is on pCloud, which syncs by filesystem
# event and ignores .gitignore entirely. Cache files are written and rewritten
# constantly, and an upload queued for a file that is then replaced strands the
# task in pCloud's queue. PYTHONPYCACHEPREFIX and MYPY_CACHE_DIR do the same for
# __pycache__ and mypy; pytest has no env var, so it is set here.
cache_dir = "~/.cache/pytest/nissan-leaf-calculator"
addopts = "-ra --strict-markers --strict-config --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gui: marks tests requiring GUI components",
]

# Coverage configuration
[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
    "setup.py",
    "legacy/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Pylint configuration
[tool.pylint.main]
# legacy/ holds the pre-refactor implementations, kept for reference only.
# Linting it only produces duplicate-code noise against the live modules.
ignore-paths = ["legacy/.*"]

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-arguments",
    "line-too-long",  # Handled by black
    # leaf_web.py uses 2-space indentation by project convention (see CLAUDE.md).
    "bad-indentation",
]

[tool.pylint.format]
max-line-length = 100